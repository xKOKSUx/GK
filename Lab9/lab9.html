<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dama szachowa</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="three.js-master/build/three.js"></script>
  <script src="resources/OrbitControls.js"></script>

<script>
  "use strict";

  let scene, camera, renderer, controls;

  function init() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);
    camera.lookAt(0, 2, 0);

    renderer = new THREE.WebGLRenderer();
    renderer.setClearColor(0xccaabb);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 10);
    scene.add(light);

    
    const points = [];
    points.push(new THREE.Vector2(0, 0));
    points.push(new THREE.Vector2(2.5, 0));
    points.push(new THREE.Vector2(2, 1));
    points.push(new THREE.Vector2(1.5, 2));
    points.push(new THREE.Vector2(1.8, 3));
    points.push(new THREE.Vector2(1.2, 4));
    points.push(new THREE.Vector2(1.5, 5));
    points.push(new THREE.Vector2(0.8, 6));
    points.push(new THREE.Vector2(1, 6.5));
    points.push(new THREE.Vector2(0.5, 7));
    points.push(new THREE.Vector2(0.6, 7.5));
    points.push(new THREE.Vector2(0.4, 8));
    points.push(new THREE.Vector2(0.8, 8.3));
    points.push(new THREE.Vector2(0, 8.5));

    const geometry = new THREE.LatheGeometry(points, 64);
    const material = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const queen = new THREE.Mesh(geometry, material);
    scene.add(queen);

  

    animate();
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  window.onload = init;
</script>
</body>
</html>
